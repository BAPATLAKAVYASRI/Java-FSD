<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Think Mart - Register</title>

    <link rel="stylesheet" href="../style/index.css">

</head>

<body>

    <!-- Header -->

    <header>

        <img
            src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRXS4t0fqUwRF70D-rAYZcaXD6xykAmzIIiO50ZAql1Cg&s"
            alt="Think Mart Logo">

        <nav>

            <ol>

                <li>
                    <a href="./index.html">Home</a>
                </li>

                <li>
                    <a href="./Products.html">Products</a>
                </li>

                <li>
                    <a href="./Cart.html">Cart</a>
                </li>

                <li>
                    <a href="./About.html">About</a>
                </li>

                <li>
                    <a href="./Contact.html">Contact</a>
                </li>

                <li>
                    <a href="./Login.html">Login</a>
                </li>

            </ol>

        </nav>

    </header>


    <!-- Register Section -->

    <main>

        <section class="auth-container">

            <div class="auth-box">

                <h1>Create Account</h1>

                <p>Join Think Mart today!</p>


                <form>

                    <!-- Name -->

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your full name"
                        required>


                    <!-- Email -->

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required>


                    <!-- Phone -->

                    <label for="phone">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="Enter your phone number"
                        required>


                    <!-- Password -->

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        required>


                    <!-- Confirm Password -->

                    <label for="confirm-password">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirm-password"
                        name="confirm-password"
                        placeholder="Confirm your password"
                        required>


                    <!-- Terms -->

                    <div class="terms">

                        <input
                            type="checkbox"
                            id="terms"
                            required>

                        <span>
                            I agree to the Terms & Conditions
                        </span>

                    </div>


                    <!-- Register Button -->

                    <button type="submit">
                        Create Account
                    </button>

                </form>


                <!-- Login Link -->

                <p class="auth-link">

                    Already have an account?

                    <a href="./Login.html">
                        Login Now
                    </a>

                </p>

            </div>

        </section>

    </main>


    <!-- Footer -->

    <footer>

        <p>
            © 2026 Think Mart. All Rights Reserved.
        </p>

    </footer>

</body>

</html>
