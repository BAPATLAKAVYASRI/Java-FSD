<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../style/index.css">
</head>

<body>

<header>
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRXS4t0fqUwRF70D-rAYZcaXD6xykAmzIIiO50ZAql1Cg&s" alt="Think Mart">

    <nav>
        <ol>
            <li><a href="./index.html">Home</a></li>
            <li><a href="./Products.html">Products</a></li>
            <li><a href="./Cart.html">Cart</a></li>
            <li><a href="./About.html">About</a></li>
            <li><a href="./Contact.html">Contact</a></li>
            <li><a href="./Login.html">Logout</a></li>
        </ol>
    </nav>
</header>

<main>

    <h1 class="page-title">Contact Us</h1>

    <section class="contact-container">

        <div class="contact-form">

            <h2>Get In Touch</h2>

            <form>

                <label>Name</label>
                <input type="text" placeholder="Enter your name" required>

                <label>Email</label>
                <input type="email" placeholder="Enter your email" required>

                <label>Message</label>
                <textarea rows="6" placeholder="Enter your message"></textarea>

                <button type="submit">Send Message</button>

            </form>

        </div>

        <div class="contact-info">

            <h2>Contact Information</h2>

            <p>📍 Address: Guntur, Andhra Pradesh, India</p>

            <p>📞 Phone: +91 98765 43210</p>

            <p>📧 Email: support@thinkmart.com</p>

            <h2>Follow Us</h2>

            <div class="social-links">
                <a href="#">Instagram</a>
                <a href="#">Facebook</a>
                <a href="#">LinkedIn</a>
                <a href="#">Twitter</a>
            </div>

        </div>

    </section>

</main>

</body>
</html>
